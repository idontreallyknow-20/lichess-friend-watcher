<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Lichess Friend Watcher</title>
    <meta name="description" content="This page does not exist. Head back to Lichess Friend Watcher, a Lichess spectator dashboard by Joseph Leung." />
    <meta name="author" content="Joseph Leung" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0f1115" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --bg-elev: #171a21;
        --border: #2a2f3a;
        --text: #e7e9ee;
        --text-dim: #9aa3b2;
        --text-muted: #8b93a1;
        --accent: #759900;
        --accent-hover: #8bb300;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(900px 520px at 15% 0%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 65%),
          var(--bg);
      }
      main {
        width: 100%;
        max-width: 460px;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        padding: 32px 28px;
        text-align: center;
      }
      .logo { font-size: 44px; line-height: 1; }
      h1 { margin: 14px 0 8px; font-size: 1.6rem; letter-spacing: -0.02em; }
      p { margin: 0 0 22px; color: var(--text-dim); line-height: 1.5; }
      a.btn {
        display: inline-block;
        padding: 11px 18px;
        background: var(--accent);
        color: #0f1115;
        font-weight: 700;
        text-decoration: none;
      }
      a.btn:hover { background: var(--accent-hover); }
      a:focus-visible { outline: 2px solid var(--accent-hover); outline-offset: 2px; }
      footer { margin-top: 24px; font-size: 0.84rem; color: var(--text-muted); }
      footer a { color: var(--accent-hover); }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">♞</div>
      <h1>Page not found</h1>
      <p>That square is empty. The watcher lives on the home page.</p>
      <a class="btn" href="/">Back to Lichess Friend Watcher</a>
      <footer>Built by <a href="https://josephleung-site.vercel.app" rel="author">Joseph Leung</a></footer>
    </main>
  </body>
</html>
